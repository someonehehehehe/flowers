<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A Garden For You ♡</title>

<!-- Fonts (optional: the site falls back to system fonts if offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. BASE & BACKGROUND
   ========================================================= */
:root{
  --pink:#ff9ecf;
  --pink-soft:#ffd6ea;
  --text:#fbeef5;
  --glass:rgba(10,14,24,.42);
  --script:'Dancing Script', 'Brush Script MT', cursive;
  --sans:'Quicksand', 'Segoe UI', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;
  overflow:hidden;                 /* no scrolling, no horizontal overflow */
  overscroll-behavior:none;
}
body{
  font-family:var(--sans);
  color:var(--text);
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(ellipse 120% 55% at 50% 112%, rgba(34,100,74,.38), transparent 62%),
    radial-gradient(ellipse 70% 50% at 15% -5%, rgba(46,46,120,.28), transparent 60%),
    linear-gradient(180deg,#04060d 0%,#050b13 50%,#06140f 100%);
}

/* Soft moonlight glow in the corner */
.moon{
  position:fixed;top:-160px;right:-120px;
  width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle, rgba(185,200,255,.11), transparent 65%);
  pointer-events:none;z-index:0;
}

/* The garden canvas */
#garden{
  position:fixed;inset:0;
  width:100%;height:100%;
  display:block;z-index:1;
}

/* Gentle vignette for depth */
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
}

/* =========================================================
   2. ROMANTIC MESSAGE CARD
   ========================================================= */
.message-card{
  position:fixed;left:50%;top:30%;
  width:min(86vw,420px);
  padding:26px 28px 24px;
  text-align:center;
  border-radius:24px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  border:1px solid rgba(255,182,213,.18);
  box-shadow:0 0 50px rgba(255,120,180,.13), inset 0 0 30px rgba(255,180,220,.04);
  opacity:0;
  transform:translate(-50%,-46%) scale(.96);
  transition:opacity 2.4s ease, transform 2.4s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;             /* clicks pass through to the flowers */
  z-index:5;
}
.message-card.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.message-title{
  font-family:var(--script);
  font-weight:700;
  font-size:clamp(2.1rem,7.5vw,2.9rem);
  line-height:1.1;
  background:linear-gradient(90deg,#ffb3d6,#ffe1ef,#ffb3d6);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,140,190,.45));
}
.divider{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:10px auto 12px;color:var(--pink);font-size:.8rem;opacity:.8;
}
.divider::before,.divider::after{
  content:"";width:52px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,170,210,.6),transparent);
}
.message-text{
  font-size:clamp(.86rem,3.5vw,1rem);
  line-height:1.75;
  color:#f6e4ee;
  font-weight:500;
  letter-spacing:.2px;
}

/* Small hint under the card */
.hint{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  font-family:var(--script);font-size:1.15rem;
  color:rgba(255,214,234,.7);
  opacity:0;transition:opacity 2s ease 1.2s;
  pointer-events:none;z-index:6;white-space:nowrap;
  text-shadow:0 0 10px rgba(255,140,190,.5);
}
.hint.show{opacity:1;animation:hintPulse 3.2s ease-in-out 3s infinite}
@keyframes hintPulse{50%{opacity:.45}}

/* =========================================================
   3. MINIMAL TOOLBAR
   ========================================================= */
.toolbar{
  position:fixed;left:50%;
  bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);
  display:flex;gap:6px;padding:6px;
  border-radius:999px;
  background:rgba(8,12,20,.5);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 6px 24px rgba(0,0,0,.35);
  opacity:0;transition:opacity 1.4s ease, transform 1.4s ease;
  z-index:10;
}
.toolbar.show{opacity:1;transform:translate(-50%,0)}
.btn{
  position:relative;
  width:42px;height:42px;border-radius:50%;
  border:none;background:transparent;cursor:pointer;
  color:var(--pink-soft);
  display:grid;place-items:center;
  transition:background .3s, transform .3s, box-shadow .3s, color .3s;
}
.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:rgba(255,158,207,.14);transform:translateY(-2px)}
.btn:active{transform:scale(.92)}
.btn.active{color:#fff;background:rgba(255,158,207,.24);box-shadow:0 0 14px rgba(255,158,207,.45)}
.btn:focus-visible{outline:1px solid var(--pink);outline-offset:2px}
.tip{
  position:absolute;bottom:calc(100% + 10px);left:50%;
  transform:translate(-50%,4px);
  padding:4px 10px;border-radius:8px;
  background:rgba(20,12,28,.85);
  font-size:.72rem;font-weight:600;letter-spacing:.3px;
  white-space:nowrap;color:var(--pink-soft);
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.btn:hover .tip{opacity:1;transform:translate(-50%,0)}
@media (hover:none){.tip{display:none}}
